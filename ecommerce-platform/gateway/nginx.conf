events {}

http {
  server {
    listen 80;

    location = /health {
      default_type text/plain;
      return 200 'gateway ok';
    }

    # Internal-only endpoints (stock reservation) must never be reachable from outside.
    location /api/products/internal {
      return 403;
    }

    # The prefix matched here is replaced by the path in proxy_pass:
    #   /api/products/5  ->  http://product-service:8000/products/5
    location /api/users    { proxy_pass http://user-service:8000/users; }
    location /api/products { proxy_pass http://product-service:8000/products; }
    location /api/cart     { proxy_pass http://cart-service:8000/cart; }
    location /api/orders   { proxy_pass http://order-service:8000/orders; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
