name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the gateway and services
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/health >/dev/null \
               && curl -sf http://localhost:8080/api/products >/dev/null; then
              echo "stack is up"; exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run end-to-end tests
        run: |
          pip install -r tests/requirements.txt
          pytest -v tests

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
