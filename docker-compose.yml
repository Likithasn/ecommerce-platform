# All defaults let `docker compose up` work even without a .env file.
x-service-env: &service-env
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecom}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  user-service:
    build: ./services/user-service
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom_pass}@postgres:5432/users_db
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    depends_on:
      postgres: {condition: service_healthy}
    restart: on-failure
    networks: [backend]

  product-service:
    build: ./services/product-service
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom_pass}@postgres:5432/products_db
    depends_on:
      postgres: {condition: service_healthy}
    restart: on-failure
    networks: [backend]

  cart-service:
    build: ./services/cart-service
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom_pass}@postgres:5432/carts_db
      PRODUCT_SERVICE_URL: http://product-service:8000
    depends_on:
      postgres: {condition: service_healthy}
      product-service: {condition: service_started}
    restart: on-failure
    networks: [backend]

  payment-service:
    build: ./services/payment-service
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom_pass}@postgres:5432/payments_db
    depends_on:
      postgres: {condition: service_healthy}
    restart: on-failure
    networks: [backend]

  notification-service:
    build: ./services/notification-service
    restart: on-failure
    networks: [backend]

  order-service:
    build: ./services/order-service
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom_pass}@postgres:5432/orders_db
      CART_SERVICE_URL: http://cart-service:8000
      PRODUCT_SERVICE_URL: http://product-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    depends_on:
      postgres: {condition: service_healthy}
      cart-service: {condition: service_started}
      product-service: {condition: service_started}
      payment-service: {condition: service_started}
      notification-service: {condition: service_started}
    restart: on-failure
    networks: [backend]

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"          # the ONLY port exposed to the outside world
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service
    restart: on-failure
    networks: [backend]

networks:
  backend:

volumes:
  pgdata:
